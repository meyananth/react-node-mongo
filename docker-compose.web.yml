services:
  mongo:
    image: mongo:7
    container_name: mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:



services:
  backend:
    build: ./backend
    container_name: backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      - MONGO_URL=mongodb://${DB_PRIVATE_IP}:27017/appdb




services:
  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://${APP_PUBLIC_IP}:3001
    container_name: frontend
    restart: unless-stopped
    ports:
      - "80:80"
